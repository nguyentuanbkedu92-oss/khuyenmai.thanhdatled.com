const LABEL_TO_SHEET = {

// ── Helpers Sheet URL ──
const csvUrl = (tabName) => {
  const gid = TAB_GID[tabName];
  if (!gid) return null;
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
};
const sheetEditUrl = (tabName) =>
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${TAB_GID[tabName] || 0}`;

// ── Cache ──
const sheetCache = {};
async function fetchSheetData(tabName) {
  if (sheetCache[tabName]) return sheetCache[tabName];
  const url = csvUrl(tabName);
  if (!url) return null;
  try {
    const resp = await fetch(url, { redirect:'follow' });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text);
    sheetCache[tabName] = rows;
    return rows;
  } catch(e) {
    console.warn("Lỗi đọc Sheet:", tabName, e);
    return null;
  }
}

// ── CSV Parser ──
function parseCSV(text) {
  const lines = [];
  let cur=[], cell="", inQ=false;
  for (let i=0; i<text.length; i++) {
    const c = text[i];
    if (c==='"') { inQ=!inQ; continue; }
    if (!inQ && c===',') { cur.push(cell.trim()); cell=""; continue; }
    if (!inQ && (c==='\n'||c==='\r')) {
      if (text[i+1]==='\n') i++;
      cur.push(cell.trim()); cell="";
      if (cur.some(x=>x)) lines.push(cur);
      cur=[]; continue;
    }
    cell+=c;
  }
  if (cell||cur.length) { cur.push(cell.trim()); if(cur.some(x=>x)) lines.push(cur); }
  if (!lines.length) return [];
  const headers = lines[0];
  return lines.slice(1).map(row => {
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=row[i]||""; });
    return obj;
  });
}

// ══════════════════════════════════════════════════════════════════
//  BUILD HTML TỪ SHEET
//  Cột: Danh mục | Câu hỏi | Loại | Nội dung | Chi tiết
//  Loại: title | subtitle | list | note | table_header | table_row
// ══════════════════════════════════════════════════════════════════
function buildHtmlFromRows(matched) {
  if (!matched || !matched.length) return null;
  let html = '';
  let inTable = false;
  let tableHeaders = [];
  let prevWasList = false;

  matched.forEach((r) => {
    const loai    = (r['Loại']||r['Loai']||'list').trim().toLowerCase();
    const noidung = (r['Nội dung']||r['Noi dung']||'').trim();
    const chitiet = (r['Chi tiết']||r['Chi tiet']||'').trim();

    if (inTable && loai !== 'table_row') {
      html += '</table>';
      inTable = false;
      tableHeaders = [];
    }

    switch(loai) {
      case 'title':
        if (prevWasList) html += '</ul>';
        prevWasList = false;
        html += `<br><strong style="color:#f5a623;font-size:14px">${noidung}</strong><br>`;
        break;

      case 'subtitle':
        if (prevWasList) html += '</ul>';
        prevWasList = false;
        html += `<br><strong style="color:#d8e8f0">${noidung}</strong>`;
        if (chitiet) html += ` <span style="color:#8ab4d4;font-size:12px">${chitiet}</span>`;
        html += '<br>';
        break;

      case 'list':
        if (!prevWasList) { html += '<ul>'; prevWasList = true; }
        html += `<li>`;
        if (chitiet) html += `<strong>${noidung}</strong> — ${chitiet}`;
        else html += noidung;
        html += `</li>`;
        break;

      case 'note':
        if (prevWasList) { html += '</ul>'; prevWasList = false; }
        html += `<div class="note-box">📌 <strong>${noidung}:</strong> ${chitiet}</div>`;
        break;

      case 'table_header':
        if (prevWasList) { html += '</ul>'; prevWasList = false; }
        tableHeaders = noidung.split('|').map(s=>s.trim());
        html += '<table><tr>';
        tableHeaders.forEach(h=>{ html += `<th>${h}</th>`; });
        html += '</tr>';
        inTable = true;
        break;

      case 'table_row':
        if (!inTable) { html += '<table>'; inTable = true; }
        let cells;
        if (noidung.includes('|')) {
          cells = noidung.split('|').map(s=>s.trim());
        } else {
          cells = [noidung, chitiet].filter(x=>x!=='');
          const ghichu = (r['Ghi chú']||r['Ghi chu']||'').trim();
          if (ghichu) cells.push(ghichu);
        }
        html += '<tr>';
        cells.forEach((c,i)=>{
          const isPrice = tableHeaders[i] && /giá|price|đơn giá/i.test(tableHeaders[i]);
          html += `<td${isPrice?' style="color:#f5a623;font-weight:700"':''}>${c}</td>`;
        });
        html += '</tr>';
        break;
    }
  });

  if (prevWasList) html += '</ul>';
  if (inTable) html += '</table>';
  return html || null;
}

// ══════════════════════════════════════════════════════════════════
//  RENDER BẢNG BÁO GIÁ
// ══════════════════════════════════════════════════════════════════
function renderPriceTable(rows, highlightCol) {
  if (!rows||!rows.length) return "<em>Chưa có dữ liệu</em>";
  const keys = Object.keys(rows[0]);
  let html = `<table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>`;
  rows.forEach(row=>{
    html += `<tr>${keys.map(k=>{
      const v=row[k]||'';
      const isHL = highlightCol && k===highlightCol;
      return `<td${isHL?' style="color:#f5a623;font-weight:700"':''}>${v}</td>`;
    }).join('')}</tr>`;
  });
  html += '</table>';
  return html;
}

// ── Chuẩn hoá tiếng Việt để tìm kiếm ──
function norm(s) {
  return (s||'').toLowerCase()
    .replace(/đ/g,'d')
    .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,'a')
    .replace(/[éèẻẽẹêếềểễệ]/g,'e')
    .replace(/[íìỉĩị]/g,'i')
    .replace(/[óòỏõọôốồổỗộơớờởỡợ]/g,'o')
    .replace(/[úùủũụưứừửữự]/g,'u')
    .replace(/[ýỳỷỹỵ]/g,'y');
}

function addBtns(btns) {

    const el = document.createElement('button');

    el.textContent = b.label;
    el.onclick = ()=>{ qr.remove(); b.fn(); };
    qr.appendChild(el);
  });
  chatArea.appendChild(qr);
  scrollBot();
  return qr;
}

// ══════════════════════════════════════════════════════════════════
//  SHOW CATEGORY — map emoji label → tên Sheet, rồi load nội dung
// ══════════════════════════════════════════════════════════════════
// Lấy tất cả tên danh mục thực tế trong rows
function getActualCats(rows) {
  if (!rows || !rows.length) return [];
  return [...new Set(rows.map(r =>
    (r['Danh mục'] || r['Danh muc'] || '').trim()
  ).filter(Boolean))];
}

// Fuzzy match: tìm tên thật trong Sheet gần với candidate nhất
function fuzzyMatch(candidate, actualCats) {
  if (!candidate || !actualCats.length) return null;
  // 1. Khớp chính xác
  if (actualCats.includes(candidate)) return candidate;
  // 2. Khớp không phân biệt hoa thường / dấu
  const nc = norm(candidate);
  for (const a of actualCats) {
    if (norm(a) === nc) return a;
  }
  // 3. Khớp một phần
  for (const a of actualCats) {
    const na = norm(a);
    if (na.includes(nc) || nc.includes(na)) return a;
  }
  return null;
}

async function showCat(catLabel) {
  const preferred = LABEL_TO_SHEET[catLabel] || catLabel;
  const { loadId } = addLoadingBubble(`Đang tải <strong>${preferred}</strong>...`);

  // Đọc song song cả 2 sheet
  const [csRows, tsRows] = await Promise.all([
    fetchSheetData('ChinhSach'),
    fetchSheetData('ThongSoDen'),
  ]);

  const csCats = getActualCats(csRows);
  const tsCats = getActualCats(tsRows);

  // Fuzzy match với preferred, fallback thử catLabel gốc
  const csMatch = fuzzyMatch(preferred, csCats) || fuzzyMatch(catLabel, csCats);
  const tsMatch = fuzzyMatch(preferred, tsCats) || fuzzyMatch(catLabel, tsCats);

  // Debug log — bỏ sau khi xác nhận ok
  console.log('[showCat] catLabel='+catLabel+' preferred='+preferred);
  console.log('[showCat] csCats:', csCats);
  console.log('[showCat] tsCats:', tsCats);
  console.log('[showCat] csMatch='+csMatch+' tsMatch='+tsMatch);

  if (csMatch && csCats.includes(csMatch)) {
    await showPolicyCat(csMatch, loadId);
  } else {
    await showProductCat(tsMatch || preferred, loadId);
  }
}

  const tabName = BAO_GIA_TAB[sheetLabel] || 'BaoGia';

  const rows = await fetchSheetData(tabName);

    addBtns(navBtns(sheetLabel)); scrollBot(); return;
  }

  const csCol = Object.keys(rows[0]).find(k=>/công suất|cong suat|cs/i.test(k));
  let filtered = rows;
  if (csCol) {
    filtered = rows.filter(r=>norm(r[csCol]||'').includes(watt.replace('w','')+'w')||
                              norm(r[csCol]||'').includes(watt));

  const priceCol = Object.keys(rows[0]).find(k=>/đơn giá|giá|price/i.test(k))||null;

  if (!filtered.length) {

      <div class="note-box">📞 Gọi <strong>0986.474.671</strong> để tư vấn công suất phù hợp.</div>`;
  } else if (filtered.length===1) {
    const r = filtered[0];
    const keys = Object.keys(r);
    let tbl = '<table>';
    keys.forEach(k=>{ if(r[k]) tbl += `<tr><td><strong>${k}</strong></td><td style="${/giá|price/i.test(k)?'color:#f5a623;font-weight:700':''}">${r[k]}</td></tr>`; });
    tbl += '</table>';
    el.outerHTML = `<div class="stag">💰 Báo Giá ${sheetLabel} — ${watt.toUpperCase()}</div><br>${tbl}
      <div class="note-box">💡 Giá chưa bao gồm VAT. Số lượng lớn có chiết khấu thêm.</div>`;
  } else {
    el.outerHTML = `<div class="stag">💰 Báo Giá ${sheetLabel} — ${watt.toUpperCase()}</div><br>
      ${renderPriceTable(filtered, priceCol)}
      <div class="note-box">💡 Giá chưa bao gồm VAT. Số lượng lớn có chiết khấu thêm.</div>`;
  }
  scrollBot();
  addBtns(navBtns(sheetLabel));
}

//  XỬ LÝ TIN NHẮN TỰ DO
// ══════════════════════════════════════════════════════════════════
function detectWatt(t) {
  const m = t.match(/(\d+)\s*w(?:att)?/);
  return m ? m[1]+'w' : null;
}

// detectCat trả về tên Sheet thật (không emoji)
function detectCat(t) {
  const map = [
    [/bong ?da|bong ?do|san ?5|san ?7|san ?11|football|soccer/,'Sân Bóng Đá'],
    [/tennis/,'Sân Tennis'],
    [/cau ?long|badminton/,'Sân Cầu Lông'],
    [/bong ?chuyen|volleyball/,'Sân Bóng Chuyền'],
    [/pickleball|pickle/,'Sân Pickleball'],
    [/den ?pha|floodlight/,'Đèn Pha LED'],
    [/den ?duong|duong pho|street/,'Đèn Đường LED'],
    [/nha ?xuong|kho|highbay|ufo/,'Đèn Nhà Xưởng LED'],
    [/san ?vuon|vuon|canh quan|am ?dat/,'Đèn Sân Vườn LED'],
    [/chinh ?sach|bao ?hanh|lap ?dat|thanh ?toan/,'Chính Sách & Dịch Vụ'],
  ];
  for (const [re,cat] of map) { if(re.test(t)) return cat; }
  return null;
}

async function handleText(raw) {
  const t = norm(raw);
  const watt = detectWatt(t);
  const cat  = detectCat(t); // tên Sheet thật

  if (watt && cat) { await showPriceByWatt(cat, watt); return; }

  if (watt && !cat) {
    // Hỏi danh mục — dùng MENU_ITEMS để hiển thị, map sang sheetLabel khi gọi
    addMsg(`Bạn cần hỏi giá đèn <strong>${watt.toUpperCase()}</strong> thuộc danh mục nào? 👇`, 'bot');
    addBtns(MENU_ITEMS.filter(m => {
      const sl = LABEL_TO_SHEET[m.label];
      return sl && BAO_GIA_TAB[sl]; // chỉ hiện danh mục có bảng giá
    }).map(m => ({
      label: m.label, cls:'cat',
      fn:()=>{ addMsg(m.label,'user'); typing(()=>showPriceByWatt(LABEL_TO_SHEET[m.label], watt)); }
    })));
    return;
  }

  if (cat) {
    // cat là tên Sheet thật, gọi trực tiếp showPolicyCat/showProductCat
    const { loadId } = addLoadingBubble(`Đang tải <strong>${cat}</strong>...`);
    const csRows = await fetchSheetData('ChinhSach');
    const isPolicy = csRows && csRows.some(r=>(r['Danh mục']||r['Danh muc']||'').trim()===cat);
    if (isPolicy) { await showPolicyCat(cat, loadId); }
    else { await showProductCat(cat, loadId); }
    return;
  }

  if (/bao ?gia|gia ?bao|gia tien|bao nhieu|cost|price|quote/.test(t)) {
    addMsg('Để báo giá chính xác, vui lòng chọn danh mục sản phẩm 👇', 'bot');
    addBtns(MENU_ITEMS.map(m=>({
      label:m.label, cls:'cat',
      fn:()=>{ addMsg(m.label,'user'); typing(()=>showCat(m.label)); }
    })));
    return;
  }

  // Không nhận ra → gợi ý menu
  addMsg(
    'Cảm ơn bạn đã liên hệ! Vui lòng chọn danh mục hoặc gọi trực tiếp:<br>' +
    `<a class="link-card green" href="tel:0986474671"><strong>📞 Hotline: 0986.474.671</strong>Hỗ trợ 8:00–22:00 hàng ngày</a>` +
    `<a class="link-card green" href="https://zalo.me/0986474671" target="_blank"><strong>💬 Zalo: 0986.474.671</strong></a>`,
    'bot'
  );
  addBtns(MENU_ITEMS.slice(0,6).map(m=>({label:m.label,cls:'cat',fn:()=>{addMsg(m.label,'user');typing(()=>showCat(m.label));}})));
}

// ── Gửi tin nhắn ──
function sendMessage() {
  if (busy) return;
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value=''; inp.style.height='auto';
  addMsg(txt,'user');
  busy=true;
  const row=document.createElement('div');
  row.className='msg bot'; row.id='tdl-typing';
  const av=document.createElement('div');
  av.className='avatar bot'; av.textContent='TDL';
  const bub=document.createElement('div');
  bub.className='bubble bot';
  bub.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  setTimeout(async()=>{
    document.getElementById('tdl-typing')?.remove();
    busy=false;
    await handleText(txt);
  }, 700+Math.random()*500);
}

const inp = document.getElementById('userInput');
inp.addEventListener('input',()=>{
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,120)+'px';
});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});

// Khởi động
setTimeout(()=>typing(showMenu), 500);
</script>
