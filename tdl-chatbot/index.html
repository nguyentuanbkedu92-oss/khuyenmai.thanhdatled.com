const sheetCache = {};

// Đọc CSV từ Google Sheet, trả về mảng [{col1, col2, ...}, ...]
async function fetchSheetData(tabName) {
  if (sheetCache[tabName]) return sheetCache[tabName];
  const url = csvUrl(tabName);
  if (!url) return null;
  try {
    const resp = await fetch(url, { redirect: 'follow' });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text);
    sheetCache[tabName] = rows;
    return rows;
  } catch(e) {
    console.warn("Lỗi đọc Sheet:", tabName, e);
    return null;
  }
}

// Parser CSV đơn giản hỗ trợ ô có dấu phẩy và xuống dòng trong ngoặc kép
function parseCSV(text) {
  const lines = [];
  let cur = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (!inQ && c === ',') { cur.push(cell.trim()); cell = ""; continue; }
    if (!inQ && (c === '\n' || c === '\r')) {
      if (text[i+1] === '\n') i++;
      cur.push(cell.trim()); cell = "";
      if (cur.some(x => x)) lines.push(cur);
      cur = []; continue;
    }
    cell += c;
  }
  if (cell || cur.length) { cur.push(cell.trim()); if (cur.some(x=>x)) lines.push(cur); }
  if (!lines.length) return [];
  const headers = lines[0];
  return lines.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i] || ""; });
    return obj;
  });
}

// Render mảng objects → HTML table (dùng keys làm header)
function renderTable(rows, highlightCol) {
  if (!rows || !rows.length) return "<em>Chưa có dữ liệu</em>";
  const keys = Object.keys(rows[0]);
  let html = `<table><tr>${keys.map(k => `<th>${k}</th>`).join("")}</tr>`;
  rows.forEach(row => {
    html += `<tr>${keys.map(k => {
      const v = row[k] || "";
      const isHL = highlightCol && k === highlightCol;
      return `<td${isHL ? ' style="color:#f5a623;font-weight:700"' : ""}>${v}</td>`;
    }).join("")}</tr>`;
  });
  html += "</table>";
  return html;
}

// Lọc rows theo cột và giá trị (không phân biệt hoa thường)
function filterRows(rows, col, value) {
  if (!col || !value) return rows;
  return rows.filter(r => (r[col]||"").toLowerCase().includes(value.toLowerCase()));
}

san_tennis: { label:"Sân Tennis", icon:"🎾", items:[

  { q:"Bố trí đèn sân tennis tiêu chuẩn", a:`<div class="stag">Bố trí (1 sân đơn 36×18m)</div><br>
<strong>Phương án 4 cột góc sân (phổ biến nhất):</strong>
<ul>
<li>4 cột thép mạ kẽm, cao <strong>8–10m</strong>, đặt cách đường biên 1–2m</li>
<li>Mỗi cột lắp <strong>2–3 bộ đèn pha 200–300W</strong> chip Bridgelux/Philips</li>
<li>Góc cột nghiêng 15° ra ngoài sân — dây cáp neo cố định</li>
<li>Góc chiếu đèn: nghiêng <strong>55°–65°</strong> so với phương ngang, hướng vào tâm sân</li>
<li>Tổng: <strong>8–12 bộ đèn/sân</strong>, đạt 300–500 lux (luyện tập đến thi đấu phong trào)</li>
</ul>
<strong>Phương án 2 hàng cột dọc sân (thi đấu chuyên nghiệp):</strong>
<ul>
<li>6–8 cột, cao 10–12m, bố trí 3–4 cột/bên dọc sân</li>
<li>Mỗi cột 2–4 bộ đèn 300–400W</li>
<li>Tổng 12–20 bộ, đạt 750–1000 lux</li>
</ul>
<div class="note-box">⚠️ Không đặt cột ở giữa 2 đầu sân (phía sau baseline) — người chơi sẽ nhìn thẳng vào đèn khi phục vụ.</div>` },
  { q:"Thiết bị TDL dùng cho sân tennis", a:`<div class="stag">Sản phẩm TDL</div><br>
<ul>
<li><strong>Đèn pha 200W–300W</strong> chip Bridgelux 5050 hoặc Philips Lumileds</li>
<li>Nguồn Done Power hoặc Philips Xitanium, IP67, dimming 0–10V</li>
<li>Góc chiếu module: <strong>30°×60°</strong> (bất đối xứng — chiếu dài theo sân)</li>
<li>Trụ thép tròn D114, dày 4mm, mạ kẽm nhúng nóng</li>
<li>Tủ điện: MCCB chống giật, timer hẹn giờ, đồng hồ điện kWh</li>
</ul>` },
  { q:"Chi phí điện sân tennis", a:`<div class="stag">Tiêu thụ điện</div><br>
<strong>Ví dụ: 1 sân tennis, 8 bộ đèn 200W:</strong>
<ul>
<li>Tổng công suất: 8 × 200W = <strong>1.600W = 1,6 kW</strong></li>
<li>Sử dụng 4 giờ/đêm: 6,4 kWh/ngày</li>
<li>30 ngày: ~192 kWh ≈ <strong>480.000 – 600.000đ/tháng</strong></li>
</ul>
<strong>So với đèn cao áp Metal Halide cũ 400W×8 bộ:</strong>
<ul><li>Tiết kiệm điện: ~<strong>65%</strong></li><li>Không cần 5–10 phút khởi động, bật tắt ngay tức thì</li></ul>` },
  { q:"Xem báo giá sân tennis", a:`Báo giá trọn gói hệ thống chiếu sáng sân tennis: đèn, trụ, tủ điện, thi công.`, sheet:true },
]},

function scrollBot() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMsg(html, type, btns=[]) {
  const row = document.createElement('div');
  row.className = 'msg ' + type;
  const av = document.createElement('div');
  av.className = 'avatar ' + type;
  av.textContent = type === 'bot' ? 'TDL' : 'Bạn';
  const bub = document.createElement('div');
  bub.className = 'bubble ' + type;
  bub.innerHTML = html;
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row);
  if (btns.length) {
    const qr = document.createElement('div');
    qr.className = 'quick-replies';
    btns.forEach(b => {
      const el = document.createElement('button');
      el.className = 'qr-btn' + (b.cls ? ' '+b.cls : '');
      el.textContent = b.label;
      el.onclick = () => { qr.remove(); b.fn(); };
      qr.appendChild(el);
    });
    chatArea.appendChild(qr);
  }
  scrollBot();
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typing(fn) {
  const row = document.createElement('div');
  row.className = 'msg bot'; row.id = 'tdl-typing';
  const av = document.createElement('div');
  av.className = 'avatar bot'; av.textContent = 'TDL';
  const bub = document.createElement('div');
  bub.className = 'bubble bot';
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  await wait(800 + Math.random() * 600);
  document.getElementById('tdl-typing')?.remove();
  fn();
}

// ── Chuẩn hóa chuỗi tiếng Việt để so sánh ──
function norm(s) {
  return (s||'').toLowerCase()
    .replace(/đ/g,'d')
    .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,'a')
    .replace(/[éèẻẽẹêếềểễệ]/g,'e')
    .replace(/[íìỉĩị]/g,'i')
    .replace(/[óòỏõọôốồổỗộơớờởỡợ]/g,'o')
    .replace(/[úùủũụưứừửữự]/g,'u')
    .replace(/[ýỳỷỹỵ]/g,'y');
}

// ── Nhận diện danh mục từ câu hỏi ──
function detectKey(t) {
  const map = [
    [/bong ?da|bong ?do|san ?5|san ?7|san ?11|football|soccer/, 'san_bong_da'],
    [/tennis/, 'san_tennis'],
    [/cau ?long|cau ?luong|badminton/, 'san_cau_long'],
    [/bong ?chuyen|volleyball/, 'san_bong_chuyen'],
    [/pickleball|pickle/, 'san_pickleball'],
    [/den ?pha|floodlight|pha led/, 'den_pha'],
    [/den ?duong|duong pho|street/, 'den_duong'],
    [/nha ?xuong|kho|xuong|highbay|ufo/, 'den_nha_xuong'],
    [/san ?vuon|vuon|canh quan|am ?dat|chieu ?cay|roi ?cot/, 'den_san_vuon'],
    [/chinh ?sach|bao ?hanh|lap ?dat|thanh ?toan|thiet ?ke/, 'chinh_sach'],
  ];
  for (const [re, key] of map) { if (re.test(t)) return key; }
  return null;
}

// ── Tìm công suất trong câu hỏi: "200w", "200 w", "200 watt" ──
function detectWatt(t) {
  const m = t.match(/(\d+)\s*w(?:att)?/);
  return m ? m[1] + 'w' : null;
}

      Không tìm thấy đèn <strong>${watt ? watt.toUpperCase() : ''}</strong> trong danh sách. Dưới đây là toàn bộ bảng giá hiện có:<br><br>
      ${renderTable(filtered.slice(0,15), 'Đơn giá')}
      <div class="note-box">📞 Cần tư vấn công suất phù hợp? Gọi <strong>0986.474.671</strong> để được hỗ trợ ngay.</div>`;
  } else if (filtered.length === 1) {
    const r = filtered[0];
    const gia = r['Đơn giá'] || r['Don gia'] || '—';
    const cs  = r['Công suất'] || r['Cong suat'] || watt;
    const chip = r['Chip LED'] || '';
    const nguon = r['Nguồn'] || r['Nguon'] || '';
    const bh   = r['Bảo hành'] || r['Bao hanh'] || '';
    const note = r['Ghi chú'] || r['Ghi chu'] || '';
    el.outerHTML = `<div class="stag">💰 Báo Giá ${catLabel}</div><br>
      <table>
        <tr><th>Thông số</th><th>Chi tiết</th></tr>
        <tr><td>Công suất</td><td><strong>${cs}</strong></td></tr>
        <tr><td>Chip LED</td><td>${chip}</td></tr>
        <tr><td>Nguồn driver</td><td>${nguon}</td></tr>
        <tr><td>Đơn giá</td><td style="color:#f5a623;font-weight:700;font-size:15px">${gia}</td></tr>
        <tr><td>Bảo hành</td><td>${bh}</td></tr>
        ${note ? `<tr><td>Ghi chú</td><td>${note}</td></tr>` : ''}
      </table>
      <div class="note-box">💡 Giá trên chưa bao gồm VAT và chi phí lắp đặt. Đặt số lượng lớn có chiết khấu thêm.</div>`;
  } else {
    el.outerHTML = `<div class="stag">💰 Báo Giá ${catLabel} — ${watt ? watt.toUpperCase() : 'Tất cả'}</div><br>
      ${renderTable(filtered.slice(0,15), 'Đơn giá')}
      <div class="note-box">💡 Giá trên chưa bao gồm VAT. Số lượng lớn có chiết khấu thêm.</div>`;
  }

  scrollBot();
  addQuickBtns(catKey);
}

function addQuickBtns(key) {
  const qr = document.createElement('div');
  qr.className = 'quick-replies';
  backBtns(key || 'den_pha').forEach(b => {
    const el = document.createElement('button');
    el.className = 'qr-btn' + (b.cls ? ' '+b.cls : '');
    el.textContent = b.label;
    el.onclick = () => { qr.remove(); b.fn(); };
    qr.appendChild(el);
  });
  chatArea.appendChild(qr); scrollBot();
}

async function handleText(raw) {
  const t = norm(raw);
  const watt = detectWatt(t);
  const catKey = detectKey(t);

  // Câu hỏi có công suất + danh mục → tra giá ngay từ Sheet
  if (watt && catKey) {
    await answerPriceQuery(raw, catKey, watt);
    return;
  }

  // Câu hỏi có công suất nhưng không rõ danh mục → hỏi lại
  if (watt && !catKey) {
    addMsg(`Bạn cần hỏi giá đèn <strong>${watt.toUpperCase()}</strong> thuộc danh mục nào? 👇`, 'bot',
      MAIN_MENU.map(m => ({ label: m.label, cls:'cat', fn: () => {
        addMsg(m.label,'user');
        typing(() => answerPriceQuery(raw + ' ' + m.label, m.key, watt));
      }}))
    );
    return;
  }

  // Câu hỏi có danh mục → vào menu danh mục
  if (catKey) { showCat(catKey); return; }

  // Hỏi giá chung → chọn danh mục
  if (/bao ?gia|gia ?bao|gia tien|tien|cost|price|quote|bao nhieu|bao nhieu tien/.test(t)) {
    addMsg('Để báo giá chính xác, vui lòng chọn danh mục sản phẩm 👇', 'bot',
      MAIN_MENU.map(m => ({ label: m.label, cls:'cat', fn: () => { addMsg(m.label,'user'); typing(() => showCat(m.key)); } }))
    );
    return;
  }

  addMsg(
    'Cảm ơn bạn đã liên hệ! Tôi chưa tìm được câu trả lời phù hợp.<br>Vui lòng chọn danh mục hoặc gọi trực tiếp để được tư vấn ngay:<br>' +
    `<a class="link-card green" href="tel:0986474671"><strong>📞 Hotline: 0986.474.671</strong>Hỗ trợ 8:00 – 22:00 hàng ngày</a>` +
    `<a class="link-card green" href="https://zalo.me/0986474671" target="_blank"><strong>💬 Zalo: 0986.474.671</strong>Gửi ảnh, bản vẽ, yêu cầu chi tiết qua Zalo</a>`,
    'bot',
    MAIN_MENU.slice(0,6).map(m => ({ label: m.label, cls:'cat', fn: () => { addMsg(m.label,'user'); typing(() => showCat(m.key)); } }))
  );
}

function sendMessage() {
  if (busy) return;
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg(txt, 'user');
  busy = true;
  // Xóa typing indicator sau 600ms rồi gọi handleText async
  const row = document.createElement('div');
  row.className = 'msg bot'; row.id = 'tdl-typing';
  const av = document.createElement('div');
  av.className = 'avatar bot'; av.textContent = 'TDL';
  const bub = document.createElement('div');
  bub.className = 'bubble bot';
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  setTimeout(async () => {
    document.getElementById('tdl-typing')?.remove();
    busy = false;
    await handleText(txt);
  }, 700 + Math.random() * 500);
}

const inp = document.getElementById('userInput');
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

setTimeout(() => typing(showMenu), 500);
</script>
</body>
</html>
