/* FIX 1: dùng dvh thay min-height:100vh để tính đúng chiều cao thực trên iOS/Android */
html, body {

}
body {

/* ── HEADER ── */
.header {
  background:linear-gradient(135deg,#0d1b2a 0%,#1a2a3a 100%);

  align-items:center;
  gap:12px;
  flex-shrink:0; /* FIX 3: không co lại */

}
.logo-circle {
  width:40px; height:40px; border-radius:50%;
  background:linear-gradient(135deg,#f5a623,#e8850a);
  display:flex; align-items:center; justify-content:center;

}
.header-info { flex:1; min-width:0; }
.header-name { font-size:15px; font-weight:700; color:#f5a623; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-sub { font-size:10px; color:#8ab4d4; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.status-wrap { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.status-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 6px #22c55e; animation:pulse 2s infinite; }
.status-txt { font-size:11px; color:#22c55e; white-space:nowrap; }

/* Ẩn contact phone trên mobile, hiện trên desktop */
.header-contact { display:none; }
.header-contact a { color:#f5a623; text-decoration:none; font-weight:600; }

/* ── CHAT AREA ── */
/* FIX 5: flex:1 + overflow-y:auto đúng cách, tránh iOS rubber-band leak */
.chat-area {
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 12px;
  display:flex;
  flex-direction:column;

  overscroll-behavior:contain;

.chat-area::-webkit-scrollbar { width:3px; }
.chat-area::-webkit-scrollbar-thumb { background:#2a4060; border-radius:3px; }

/* ── MESSAGES ── */
.msg { display:flex; gap:8px; animation:fadeIn 0.25s ease; }

.msg.user { flex-direction:row-reverse; }

.avatar.user { background:#1e3a5f; color:#8ab4d4; }

.bubble { max-width:calc(100% - 48px); padding:10px 14px; border-radius:18px; line-height:1.6; font-size:13.5px; word-break:break-word; }

.bubble.user { background:linear-gradient(135deg,#1a4a7a,#0d3060); border-radius:18px 4px 18px 18px; color:#e8f4ff; text-align:right; }

};

const sheetCache = {};

async function fetchSheetData(tabName) {
  if (sheetCache[tabName]) return sheetCache[tabName];
  const url = csvUrl(tabName);
  if (!url) return null;
  try {
    const resp = await fetch(url, { redirect: 'follow' });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text);
    sheetCache[tabName] = rows;
    return rows;
  } catch(e) {
    console.warn("Lỗi đọc Sheet:", tabName, e);
    return null;
  }
}

function parseCSV(text) {
  const lines = [];
  let cur = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (!inQ && c === ',') { cur.push(cell.trim()); cell = ""; continue; }
    if (!inQ && (c === '\n' || c === '\r')) {
      if (text[i+1] === '\n') i++;
      cur.push(cell.trim()); cell = "";
      if (cur.some(x => x)) lines.push(cur);
      cur = []; continue;
    }
    cell += c;
  }
  if (cell || cur.length) { cur.push(cell.trim()); if (cur.some(x=>x)) lines.push(cur); }
  if (!lines.length) return [];
  const headers = lines[0];
  return lines.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i] || ""; });
    return obj;
  });
}

function renderTable(rows, highlightCol) {
  if (!rows || !rows.length) return "<em>Chưa có dữ liệu</em>";
  const keys = Object.keys(rows[0]);
  let html = `<table><tr>${keys.map(k => `<th>${k}</th>`).join("")}</tr>`;
  rows.forEach(row => {
    html += `<tr>${keys.map(k => {
      const v = row[k] || "";
      const isHL = highlightCol && k === highlightCol;
      return `<td${isHL ? ' style="color:#f5a623;font-weight:700"' : ""}>${v}</td>`;
    }).join("")}</tr>`;
  });
  html += "</table>";
  return html;
}

function filterRows(rows, col, value) {
  if (!col || !value) return rows;
  return rows.filter(r => (r[col]||"").toLowerCase().includes(value.toLowerCase()));
}

const chatArea = document.getElementById('chatArea');
let busy = false;

function scrollBot() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMsg(html, type, btns=[]) {
  const row = document.createElement('div');
  row.className = 'msg ' + type;
  const av = document.createElement('div');
  av.className = 'avatar ' + type;
  av.textContent = type === 'bot' ? 'TDL' : 'Bạn';
  const bub = document.createElement('div');
  bub.className = 'bubble ' + type;
  bub.innerHTML = html;
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row);
  if (btns.length) {
    const qr = document.createElement('div');
    qr.className = 'quick-replies';
    btns.forEach(b => {
      const el = document.createElement('button');
      el.className = 'qr-btn' + (b.cls ? ' '+b.cls : '');
      el.textContent = b.label;
      el.onclick = () => { qr.remove(); b.fn(); };
      qr.appendChild(el);
    });
    chatArea.appendChild(qr);
  }
  scrollBot();
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typing(fn) {
  const row = document.createElement('div');
  row.className = 'msg bot'; row.id = 'tdl-typing';
  const av = document.createElement('div');
  av.className = 'avatar bot'; av.textContent = 'TDL';
  const bub = document.createElement('div');
  bub.className = 'bubble bot';
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  await wait(800 + Math.random() * 600);
  document.getElementById('tdl-typing')?.remove();
  fn();
}

  btns.push({ label:'🏠 Menu chính', fn: () => { addMsg('🏠 Menu chính','user'); typing(showMenu); } });
  addMsg(`<div class="stag">${cat.icon} ${cat.label}</div><br>Chọn câu hỏi bạn cần tư vấn:`, 'bot', btns);

function norm(s) {
  return (s||'').toLowerCase()
    .replace(/đ/g,'d')
    .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,'a')
    .replace(/[éèẻẽẹêếềểễệ]/g,'e')
    .replace(/[íìỉĩị]/g,'i')
    .replace(/[óòỏõọôốồổỗộơớờởỡợ]/g,'o')
    .replace(/[úùủũụưứừửữự]/g,'u')
    .replace(/[ýỳỷỹỵ]/g,'y');
}

function detectKey(t) {
  const map = [
    [/bong ?da|bong ?do|san ?5|san ?7|san ?11|football|soccer/, 'san_bong_da'],
    [/tennis/, 'san_tennis'],
    [/cau ?long|cau ?luong|badminton/, 'san_cau_long'],
    [/bong ?chuyen|volleyball/, 'san_bong_chuyen'],
    [/pickleball|pickle/, 'san_pickleball'],
    [/den ?pha|floodlight|pha led/, 'den_pha'],
    [/den ?duong|duong pho|street/, 'den_duong'],
    [/nha ?xuong|kho|xuong|highbay|ufo/, 'den_nha_xuong'],
    [/san ?vuon|vuon|canh quan|am ?dat|chieu ?cay|roi ?cot/, 'den_san_vuon'],
    [/chinh ?sach|bao ?hanh|lap ?dat|thanh ?toan|thiet ?ke/, 'chinh_sach'],
  ];
  for (const [re, key] of map) { if (re.test(t)) return key; }
  return null;
}

function detectWatt(t) {
  const m = t.match(/(\d+)\s*w(?:att)?/);
  return m ? m[1] + 'w' : null;
}

async function answerPriceQuery(raw, catKey, watt) {

    addQuickBtns(catKey); scrollBot(); return;
  }

  let filtered = rows;

    filtered = rows.filter(r => {

      ${renderTable(filtered.slice(0,15), 'Đơn giá')}

  } else if (filtered.length === 1) {
    const r = filtered[0];
    const gia = r['Đơn giá'] || r['Don gia'] || '—';

    el.outerHTML = `<div class="stag">💰 Báo Giá ${catLabel}</div><br>
      <table>
        <tr><th>Thông số</th><th>Chi tiết</th></tr>
        <tr><td>Công suất</td><td><strong>${cs}</strong></td></tr>
        <tr><td>Chip LED</td><td>${chip}</td></tr>

        <tr><td>Bảo hành</td><td>${bh}</td></tr>
        ${note ? `<tr><td>Ghi chú</td><td>${note}</td></tr>` : ''}
      </table>
      <div class="note-box">💡 Giá trên chưa bao gồm VAT và chi phí lắp đặt.</div>`;
  } else {
    el.outerHTML = `<div class="stag">💰 Báo Giá ${catLabel} — ${watt ? watt.toUpperCase() : 'Tất cả'}</div><br>
      ${renderTable(filtered.slice(0,15), 'Đơn giá')}
      <div class="note-box">💡 Giá trên chưa bao gồm VAT. Số lượng lớn có chiết khấu thêm.</div>`;

function addQuickBtns(key) {

    el.textContent = b.label;
    el.onclick = () => { qr.remove(); b.fn(); };
    qr.appendChild(el);
  });
  chatArea.appendChild(qr); scrollBot();
}

async function handleText(raw) {
  const t = norm(raw);
  const watt = detectWatt(t);
  const catKey = detectKey(t);

  if (watt && catKey) {
    await answerPriceQuery(raw, catKey, watt);
    return;
  }

  if (watt && !catKey) {
    addMsg(`Bạn cần hỏi giá đèn <strong>${watt.toUpperCase()}</strong> thuộc danh mục nào? 👇`, 'bot',
      MAIN_MENU.map(m => ({ label: m.label, cls:'cat', fn: () => {
        addMsg(m.label,'user');
        typing(() => answerPriceQuery(raw + ' ' + m.label, m.key, watt));
      }}))
    );
    return;
  }

  if (catKey) { showCat(catKey); return; }

  if (/bao ?gia|gia ?bao|gia tien|tien|cost|price|quote|bao nhieu|bao nhieu tien/.test(t)) {
    addMsg('Để báo giá chính xác, vui lòng chọn danh mục sản phẩm 👇', 'bot',
      MAIN_MENU.map(m => ({ label: m.label, cls:'cat', fn: () => { addMsg(m.label,'user'); typing(() => showCat(m.key)); } }))
    );
    return;
  }

  addMsg(
    'Cảm ơn bạn đã liên hệ! Tôi chưa tìm được câu trả lời phù hợp.<br>Vui lòng chọn danh mục hoặc gọi trực tiếp để được tư vấn ngay:<br>' +
    `<a class="link-card green" href="tel:0986474671"><strong>📞 Hotline: 0986.474.671</strong>Hỗ trợ 8:00 – 22:00 hàng ngày</a>` +
    `<a class="link-card green" href="https://zalo.me/0986474671" target="_blank"><strong>💬 Zalo: 0986.474.671</strong>Gửi ảnh, bản vẽ, yêu cầu chi tiết qua Zalo</a>`,
    'bot',
    MAIN_MENU.slice(0,6).map(m => ({ label: m.label, cls:'cat', fn: () => { addMsg(m.label,'user'); typing(() => showCat(m.key)); } }))
  );
}

function sendMessage() {
  if (busy) return;
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg(txt, 'user');
  busy = true;
  const row = document.createElement('div');
  row.className = 'msg bot'; row.id = 'tdl-typing';
  const av = document.createElement('div');
  av.className = 'avatar bot'; av.textContent = 'TDL';
  const bub = document.createElement('div');
  bub.className = 'bubble bot';
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  setTimeout(async () => {
    document.getElementById('tdl-typing')?.remove();
    busy = false;
    await handleText(txt);
  }, 700 + Math.random() * 500);
}

const inp = document.getElementById('userInput');
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

setTimeout(() => typing(showMenu), 500);
