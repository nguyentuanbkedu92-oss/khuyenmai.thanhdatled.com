  { label:"📋 Chính Sách & Dịch Vụ" },
  { label:"💡 Đèn Pha LED" },
  { label:"🛣️ Đèn Đường LED" },

const csvUrl = (tabName) => {
  const gid = TAB_GID[tabName];
  if (!gid) return null;
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
};
const sheetEditUrl = (tabName) =>
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${TAB_GID[tabName]||0}`;

const sheetCache = {};
async function fetchSheetData(tabName) {
  if (sheetCache[tabName]) return sheetCache[tabName];
  const url = csvUrl(tabName);
  if (!url) return null;
  try {
    const resp = await fetch(url, { redirect:"follow" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text);
    sheetCache[tabName] = rows;
    return rows;
  } catch(e) {
    console.warn("Lỗi đọc Sheet:", tabName, e);
    return null;
  }
}

function parseCSV(text) {
  const lines = [];
  let cur=[], cell="", inQ=false;
  for (let i=0; i<text.length; i++) {
    const c = text[i];
    if (c==='"') { inQ=!inQ; continue; }
    if (!inQ && c===',') { cur.push(cell.trim()); cell=""; continue; }
    if (!inQ && (c==='\n'||c==='\r')) {
      if (text[i+1]==='\n') i++;
      cur.push(cell.trim()); cell="";
      if (cur.some(x=>x)) lines.push(cur);
      cur=[]; continue;
    }
    cell+=c;
  }
  if (cell||cur.length) { cur.push(cell.trim()); if(cur.some(x=>x)) lines.push(cur); }
  if (!lines.length) return [];
  const headers = lines[0];
  return lines.slice(1).map(row=>{
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=row[i]||""; });
    return obj;
  });
}

// Bọc bảng trong div scroll để không tràn ngang
function wrapTable(tableHtml) {
  return `<div class="table-wrap">${tableHtml}</div>`;
}

function buildHtmlFromRows(matched) {
  if (!matched||!matched.length) return null;
  let html="", inTable=false, tableHeaders=[], prevWasList=false, tableRows="";

  matched.forEach(r=>{
    const loai    = (r["Loại"]||r["Loai"]||"list").trim().toLowerCase();
    const noidung = (r["Nội dung"]||r["Noi dung"]||"").trim();
    const chitiet = (r["Chi tiết"]||r["Chi tiet"]||"").trim();
    const ghichu  = (r["Ghi chú"]||r["Ghi chu"]||"").trim();

    if (inTable && loai!=="table_row") {
      tableRows+="</table>";
      html+=wrapTable(tableRows);
      tableRows=""; inTable=false; tableHeaders=[];
    }

    switch(loai) {
      case "title":
        if (prevWasList) { html+="</ul>"; prevWasList=false; }
        html+=`<br><strong style="color:#f5a623;font-size:14px">${noidung}</strong><br>`;
        break;
      case "subtitle":
        if (prevWasList) { html+="</ul>"; prevWasList=false; }
        html+=`<br><strong style="color:#d8e8f0">${noidung}</strong>`;
        if (chitiet) html+=` <span style="color:#8ab4d4;font-size:12px">${chitiet}</span>`;
        html+="<br>";
        break;
      case "list":
        if (!prevWasList) { html+="<ul>"; prevWasList=true; }
        html+="<li>";
        if (chitiet) html+=`<strong>${noidung}</strong> — ${chitiet}`;
        else html+=noidung;
        html+="</li>";
        break;
      case "note":
        if (prevWasList) { html+="</ul>"; prevWasList=false; }
        html+=`<div class="note-box">📌 <strong>${noidung}:</strong> ${chitiet}</div>`;
        break;
      case "table_header":
        if (prevWasList) { html+="</ul>"; prevWasList=false; }
        tableHeaders=noidung.split("|").map(s=>s.trim());
        tableRows="<table><tr>";
        tableHeaders.forEach(h=>{ tableRows+=`<th>${h}</th>`; });
        tableRows+="</tr>";
        inTable=true;
        break;
      case "table_row":
        if (!inTable) { tableRows="<table>"; inTable=true; }
        let cells;
        if (noidung.includes("|")) {
          cells=noidung.split("|").map(s=>s.trim());
        } else {
          cells=[noidung,chitiet].filter(x=>x!=="");
          if (ghichu) cells.push(ghichu);
        }
        tableRows+="<tr>";
        cells.forEach((c,i)=>{
          const isPrice=tableHeaders[i]&&/giá|price|đơn giá/i.test(tableHeaders[i]);
          tableRows+=`<td${isPrice?" style=\"color:#f5a623;font-weight:700\"":""}>${c}</td>`;
        });
        tableRows+="</tr>";
        break;
    }
  });

  if (prevWasList) html+="</ul>";
  if (inTable) { tableRows+="</table>"; html+=wrapTable(tableRows); }
  return html||null;
}

function fixDriveUrl(url) {
  if (!url) return null;
  // Google Drive: thử nhiều dạng URL khác nhau
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) {
    const id = m[1];
    // Thử lần lượt: uc?export=download → uc?id= → thumbnail
    return `https://lh3.googleusercontent.com/d/${id}`;
  }
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m2) return `https://lh3.googleusercontent.com/d/${m2[1]}`;
  // Không phải Drive → trả nguyên link (website bình thường load được)
  return url;
}

function renderPriceTable(rows, highlightCol) {
  if (!rows||!rows.length) return "<em>Chưa có dữ liệu</em>";
  const allKeys = Object.keys(rows[0]);
  // Bỏ cột Danh mục khỏi hiển thị
  const skipKeys = k => /^danh.?m[uụ]c$/i.test(k.trim());
  // Tìm cột ảnh
  const imgKey = allKeys.find(k => /^(ảnh|anh|hình|hinh|image|img|photo)$/i.test(k.trim()));
  const keys = allKeys.filter(k => !skipKeys(k) && k !== imgKey);

  // Nếu có cột ảnh → render dạng card
  if (imgKey) {
    let html = `<div style="display:flex;flex-direction:column;gap:10px;margin:6px 0">`;
    rows.forEach(row => {
      const rawImg = (row[imgKey]||"").trim();
      // fixDriveUrl trả null nếu không xử lý được, fallback dùng rawImg
      const imgUrl = rawImg ? (fixDriveUrl(rawImg) || rawImg) : null;
      const priceKey = keys.find(k => /đơn giá|don gia|price|giá/i.test(k));
      const nameKey  = keys.find(k => /tên|ten|model|sản phẩm|san pham|loại|loai/i.test(k)) || keys[0];
      html += `<div style="display:flex;gap:10px;background:#0d2030;border:1px solid #1e3550;border-radius:10px;overflow:hidden;align-items:stretch">`;
      if (imgUrl) {
        html += `<div style="flex-shrink:0;width:90px;min-height:80px;background:#091520;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <img src="${imgUrl}" alt="${row[nameKey]||''}"
            style="width:90px;height:90px;object-fit:contain;display:block"
            onerror="this.style.display='none'"
          />
        </div>`;
      }
      html += `<div style="flex:1;padding:10px 12px;min-width:0">`;
      keys.forEach(k => {
        const v = (row[k]||"").trim();
        if (!v) return;
        const isPrice = k === priceKey;
        const isName  = k === nameKey;
        if (isName) {
          html += `<div style="font-weight:700;font-size:13.5px;color:#d8e8f0;margin-bottom:4px">${v}</div>`;
        } else if (isPrice) {
          html += `<div style="color:#f5a623;font-weight:700;font-size:14px;margin:3px 0">${v}</div>`;
        } else {
          html += `<div style="font-size:12px;color:#8ab4d4;margin:1px 0"><span style="color:#6a8aaa">${k}:</span> ${v}</div>`;
        }
      });
      html += `</div></div>`;
    });
    html += `</div>`;
    return html;
  }

  // Không có ảnh → bảng thông thường
  let tbl=`<table><tr>${keys.map(k=>`<th>${k}</th>`).join("")}</tr>`;
  rows.forEach(row=>{
    tbl+=`<tr>${keys.map(k=>{
      const v=row[k]||"";
      const isHL=highlightCol&&k===highlightCol;
      return `<td${isHL?" style=\"color:#f5a623;font-weight:700\"":""}>${v}</td>`;
    }).join("")}</tr>`;
  });
  tbl+="</table>";
  return wrapTable(tbl);
}

function norm(s) {
  return (s||"").toLowerCase()
    .replace(/đ/g,"d")
    .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,"a")
    .replace(/[éèẻẽẹêếềểễệ]/g,"e")
    .replace(/[íìỉĩị]/g,"i")

const chatArea = document.getElementById("chatArea");
let busy = false;

function scrollBot() { chatArea.scrollTop=chatArea.scrollHeight; }

function addMsg(html, type) {
  const row=document.createElement("div"); row.className="msg "+type;
  const av=document.createElement("div"); av.className="avatar "+type;
  av.textContent=type==="bot"?"TDL":"Bạn";
  const bub=document.createElement("div"); bub.className="bubble "+type;
  bub.innerHTML=html;
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  return bub;
}

function addBtns(btns) {
  const qr=document.createElement("div"); qr.className="quick-replies";
  btns.forEach(b=>{
    const el=document.createElement("button");
    el.className="qr-btn"+(b.cls?" "+b.cls:"");
    el.textContent=b.label;
    el.onclick=()=>{ qr.remove(); b.fn(); };
    qr.appendChild(el);
  });
  chatArea.appendChild(qr); scrollBot();
  return qr;
}

function addLoadingBubble(msg) {
  const loadId="load-"+Date.now();
  const row=document.createElement("div"); row.className="msg bot";
  const av=document.createElement("div"); av.className="avatar bot"; av.textContent="TDL";
  const bub=document.createElement("div"); bub.className="bubble bot";
  bub.innerHTML=`<span id="${loadId}">⏳ ${msg||"Đang tải..."}</span>`;
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  return { loadId, bub };
}

function typing(fn) {
  return new Promise(res=>{
    const row=document.createElement("div");
    row.className="msg bot"; row.id="tdl-typing";
    const av=document.createElement("div"); av.className="avatar bot"; av.textContent="TDL";
    const bub=document.createElement("div"); bub.className="bubble bot";
    bub.innerHTML="<div class=\"typing\"><span></span><span></span><span></span></div>";
    row.appendChild(av); row.appendChild(bub);
    chatArea.appendChild(row); scrollBot();
    setTimeout(()=>{
      document.getElementById("tdl-typing")?.remove();
      fn(); res();
    }, 700+Math.random()*500);
  });
}

function detectWatt(t) {
  const m=t.match(/(\d+)\s*w(?:att)?/);
  return m?m[1]+"w":null;
}

function detectCat(t) {
  const map=[
    [/bong ?da|bong ?do|san ?5|san ?7|san ?11|football|soccer/,"Sân Bóng Đá"],
    [/tennis/,"Sân Tennis"],
    [/cau ?long|badminton/,"Sân Cầu Lông"],
    [/bong ?chuyen|volleyball/,"Sân Bóng Chuyền"],
    [/pickleball|pickle/,"Sân Pickleball"],
    [/den ?pha|floodlight/,"Đèn Pha LED"],
    [/den ?duong|duong pho|street/,"Đèn Đường LED"],
    [/nha ?xuong|kho|highbay|ufo/,"Đèn Nhà Xưởng LED"],
    [/san ?vuon|vuon|canh quan|am ?dat/,"Đèn Sân Vườn LED"],
    [/chinh ?sach|bao ?hanh|lap ?dat|thanh ?toan/,"Chính Sách & Dịch Vụ"],
  ];
  for (const [re,cat] of map) { if(re.test(t)) return cat; }
  return null;
}

async function handleText(raw) {
  const t=norm(raw);
  const watt=detectWatt(t);
  const cat=detectCat(t);
  if (watt&&cat) { await showPriceByWatt(cat,watt); return; }
  if (watt&&!cat) {
    addMsg(`Bạn cần hỏi giá đèn <strong>${watt.toUpperCase()}</strong> thuộc danh mục nào? 👇`,"bot");
    addBtns(MENU_ITEMS.filter(m=>BAO_GIA_TAB[LABEL_TO_SHEET[m.label]]).map(m=>({
      label:m.label, cls:"cat",
      fn:()=>{ addMsg(m.label,"user"); typing(()=>showPriceByWatt(LABEL_TO_SHEET[m.label],watt)); }
    })));
    return;
  }
  if (cat) {
    const { loadId }=addLoadingBubble(`Đang tải <strong>${cat}</strong>...`);
    const csRows=await fetchSheetData("ChinhSach");
    const isPolicy=csRows&&csRows.some(r=>(r["Danh mục"]||r["Danh muc"]||"").trim()===cat);
    if (isPolicy) await showPolicyCat(cat,loadId);
    else await showProductCat(cat,loadId);
    return;
  }
  if (/bao ?gia|gia ?bao|gia tien|bao nhieu|cost|price|quote/.test(t)) {
    addMsg("Để báo giá chính xác, vui lòng chọn danh mục sản phẩm 👇","bot");
    addBtns(MENU_ITEMS.map(m=>({ label:m.label, cls:"cat", fn:()=>{ addMsg(m.label,"user"); typing(()=>showCat(m.label)); } })));
    return;
  }
  addMsg(
    "Cảm ơn bạn đã liên hệ! Vui lòng chọn danh mục hoặc gọi trực tiếp:<br>"+
    `<a class="link-card green" href="tel:0986474671"><strong>📞 Hotline: 0986.474.671</strong>Hỗ trợ 8:00–22:00 hàng ngày</a>`+
    `<a class="link-card green" href="https://zalo.me/0986474671" target="_blank"><strong>💬 Zalo: 0986.474.671</strong></a>`,
    "bot"
  );
  addBtns(MENU_ITEMS.slice(0,6).map(m=>({ label:m.label, cls:"cat", fn:()=>{ addMsg(m.label,"user"); typing(()=>showCat(m.label)); } })));
}

function sendMessage() {
  if (busy) return;
  const inp=document.getElementById("userInput");
  const txt=inp.value.trim();
  if (!txt) return;
  inp.value=""; inp.style.height="auto";
  addMsg(txt,"user");
  busy=true;
  const row=document.createElement("div"); row.className="msg bot"; row.id="tdl-typing";
  const av=document.createElement("div"); av.className="avatar bot"; av.textContent="TDL";
  const bub=document.createElement("div"); bub.className="bubble bot";
  bub.innerHTML="<div class=\"typing\"><span></span><span></span><span></span></div>";
  row.appendChild(av); row.appendChild(bub);
  chatArea.appendChild(row); scrollBot();
  setTimeout(async()=>{
    document.getElementById("tdl-typing")?.remove();
    busy=false;
    await handleText(txt);
  }, 700+Math.random()*500);
}

const inp=document.getElementById("userInput");
inp.addEventListener("input",()=>{
  inp.style.height="auto";
  inp.style.height=Math.min(inp.scrollHeight,120)+"px";
});
inp.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});

setTimeout(()=>typing(showMenu), 500);
</script>
